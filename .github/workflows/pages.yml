name: Publicar web (GitHub Pages)
# Publica la app como web en https://avillar25.github.io/puntua

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE", "android/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Generar la web
        run: python3 scripts/build-web.py
      - name: Preparar
        run: mkdir -p _site && cp -r www/. _site/ && mkdir -p images && cp -r images _site/images
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      # A veces GitHub tarda unos segundos en tener lista la web subida: si falla, se espera y se reintenta
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
