name: Actualizar catálogo
# Cada lunes: notas de IMDb y Metacritic, duraciones, capítulos de las series y catálogo de Descubrir. Luego publica la web.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/update-catalog.py", "scripts/build-discover.py", "scripts/fill-covers.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
      - name: Actualizar datos
        run: python3 scripts/update-catalog.py
      - name: Carátulas que faltan en el catálogo
        run: python3 scripts/fill-covers.py
      - name: Catálogo de Descubrir
        run: python3 scripts/build-discover.py
      - name: Guardar cambios
        run: |
          git config user.name "Puntúa (actualización automática)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/meta.js catalog/
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Catálogo: actualización semanal de notas, duraciones y capítulos" && git pull --rebase -X theirs origin main && git push; fi

  web:
    needs: update
    uses: ./.github/workflows/pages.yml
