name: Popular ahora
# Cada día: recalcula «Popular ahora» de Descubrir (visitas de la semana en Wikipedia) y publica la web.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Popular ahora
        run: python3 scripts/build-discover.py --popular
      - name: Guardar cambios
        run: |
          git config user.name "Puntúa (actualización automática)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalog/
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Descubrir: popular ahora" && git pull --rebase -X theirs origin main && git push; fi

  web:
    needs: update
    uses: ./.github/workflows/pages.yml
